# Homelab fork only: publishes ghcr.io/petzah/postfix_exporter:<tag> for tags like
# 0.21.2-homelab.1, built as upstream's default image (CGO off, no systemd source).
name: Publish homelab image

on:
  push:
    tags:
      - '*-homelab.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -tags nosystemd ./...

      - name: Build the binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -tags nosystemd -trimpath \
              -ldflags "-w -s -X github.com/prometheus/common/version.Version=${GITHUB_REF_NAME} -X github.com/prometheus/common/version.Revision=${GITHUB_SHA}" \
              -o linux/$arch/postfix_exporter .
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
